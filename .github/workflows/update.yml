name: Update surf data

on:
  schedule:
    # Every 3 hours. 02:47 and 14:47 UTC land after the NWS Honolulu afternoon and morning issuances.
    - cron: "47 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: surf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start from the last published data (kept if a source is down)
        run: |
          git fetch --depth 1 origin gh-pages && git show origin/gh-pages:data.json > data.json || echo "no published data yet"

      - name: Fetch NWS forecast, Hilo buoy and Big Island Now
        run: python3 scripts/update.py

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish surf data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
