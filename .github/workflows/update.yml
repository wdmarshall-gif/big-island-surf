name: Update surf data

on:
  schedule:
    # Twice a day: 02:47 and 14:47 UTC (4:47 PM and 4:47 AM HST), after the NWS Honolulu afternoon and morning issuances.
    - cron: "47 2,14 * * *"
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths-ignore: ["data.json"]

permissions:
  contents: write

concurrency:
  group: surf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the NWS surf forecast and 7-day swell
        run: python3 scripts/update.py

      - name: Publish data.json (GitHub Pages redeploys on push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -q -m "Update surf data"
            git push -q
          fi
