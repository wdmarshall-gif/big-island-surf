name: Update surf data

on:
  schedule:
    # Twice a day: 02:47 and 14:47 UTC (4:47 PM and 4:47 AM HST), after the NWS Honolulu afternoon and morning issuances.
    - cron: "47 2,14 * * *"
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths-ignore: ["data.json"]

permissions:
  contents: write

concurrency:
  group: surf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the NWS surf forecast and 7-day swell
        run: python3 scripts/update.py

      - name: Publish data.json (GitHub Pages redeploys on push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -q -m "Update surf data"
            # GitHub occasionally rejects a push with a temporary server error.
            # Try up to 3 times, waiting 20s then 60s, rebasing in case the branch moved.
            for wait in 20 60 0; do
              git push -q && exit 0
              [ "$wait" -eq 0 ] && break
              echo "Push failed; retrying in ${wait}s"
              sleep "$wait"
              git pull -q --rebase -X theirs origin gh-pages || { git rebase --abort; break; }
            done
            echo "::error::Push failed after 3 attempts; the next scheduled run will try again"
            exit 1
          fi
